<!DOCTYPE html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>สั่งซื้อ · Leaf Hair</title><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Noto+Sans+Thai:wght@300;400;500&display=swap" rel="stylesheet"><link rel="stylesheet" href="style.css"></head><body><nav><a class="logo" href="index.html">Leaf Hair</a><div><a href="index.html">หน้าแรก</a><a href="product.html">สินค้า</a><a href="admin.html">แอดมิน</a></div></nav><main><h2>สั่งซื้อสินค้า</h2><p class="sub">กรอกที่อยู่จัดส่งให้ครบ เพื่อจัดของและพิมพ์ใบปะหน้าได้ถูกต้อง</p><form id="orderForm"><label>สินค้า<select id="sku"></select></label><label>จำนวน (ขวด)<input id="qty" type="number" min="1" value="1" required></label><label>รายการสินค้า<input id="items" readonly></label><label>ยอดรวม (บาท)<input id="total" readonly></label><label>ชื่อ-นามสกุลผู้รับ<input id="customerName" required></label><label>เบอร์โทร<input id="phone" required pattern="0[0-9]{8,9}" inputmode="tel" placeholder="08xxxxxxxx"></label><label>ที่อยู่จัดส่ง (บ้านเลขที่ ถนน ตำบล อำเภอ จังหวัด)<textarea id="address" rows="3" required></textarea></label><label>รหัสไปรษณีย์<input id="postcode" required pattern="[0-9]{5}" inputmode="numeric"></label><label>หมายเหตุ<textarea id="note" rows="2"></textarea></label><button class="btn" type="submit">ยืนยันสั่งซื้อ</button></form></main><footer>© Leaf Hair</footer><script src="script.js"></script></body></html>
